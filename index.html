<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Five Dice</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Five Dice</span>
        <span class="navbar-text" id="engine-status">Engine: local fallback</span>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row g-4">
        <div class="col-lg-8">
          <section class="table-felt rounded-4 p-4 p-md-5 text-center">
            <p class="text-white-50 mb-4" id="turn-status">
              Click Roll to throw all five dice. Click a die to hold it.
            </p>

            <div class="dice-row" id="dice-row" aria-label="Five dice"></div>

            <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
              <button type="button" class="btn btn-light btn-lg px-4" id="roll-btn">
                Roll
              </button>
              <button type="button" class="btn btn-outline-light" id="new-game-btn">
                New game
              </button>
            </div>
          </section>
        </div>

        <div class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-header">Turn</div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item d-flex justify-content-between">
                Rolls left <span class="fw-semibold" id="rolls-left">3</span>
              </li>
              <li class="list-group-item d-flex justify-content-between">
                Held dice <span class="fw-semibold" id="held-count">0</span>
              </li>
              <li class="list-group-item d-flex justify-content-between">
                Values
                <span class="fw-semibold font-monospace" id="values-label">—</span>
              </li>
            </ul>
          </div>

          <div class="card shadow-sm mt-3">
            <div class="card-header">Score (preview)</div>
            <div class="card-body p-0">
              <table class="table table-sm mb-0" id="score-table">
                <tbody></tbody>
              </table>
            </div>
            <div class="card-footer text-muted small">
              Scoring is local for now. Wire <code>js/api.js</code> to your engine when it is ready.
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/api.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
