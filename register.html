<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register — Lucky Dice</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="register-page">
    <div id="register-screen">
      <div class="register-phone">
        <header class="register-top">
          <a class="register-icon-btn" href="index.html" aria-label="Back">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M10.2 3.2 5.4 8l4.8 4.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </a>
          <h1 class="register-heading">Registration</h1>
          <button type="button" class="register-icon-btn" aria-label="Menu">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M3 4.5h10M3 8h10M3 11.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
            </svg>
          </button>
        </header>

        <form id="register-form" class="register-form" novalidate>
          <div class="register-layout">
            <div class="register-rail" aria-hidden="true">
              <span class="register-step is-active">1</span>
              <span class="register-line"></span>
              <span class="register-step">2</span>
            </div>

            <div class="register-column">
              <h2 class="register-section">Account details</h2>

              <div class="register-fields">
                <label class="register-label" for="register-userid">User ID</label>
                <div class="register-field">
                  <input
                    class="register-input"
                    id="register-userid"
                    name="userId"
                    autocomplete="username"
                    required
                  />
                  <svg class="register-check" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                    <path d="M3.2 8.3 6.4 11.4 12.8 4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                </div>

                <label class="register-label" for="register-email">Email</label>
                <input
                  type="email"
                  class="register-input"
                  id="register-email"
                  name="emailAddress"
                  autocomplete="email"
                  placeholder="E-mail"
                  required
                />

                <label class="register-label" for="register-password">Password</label>
                <input
                  type="password"
                  class="register-input"
                  id="register-password"
                  name="password"
                  autocomplete="new-password"
                  placeholder="Password"
                  required
                />

                <label class="register-label" for="register-confirm">Confirm Password</label>
                <input
                  type="password"
                  class="register-input"
                  id="register-confirm"
                  autocomplete="new-password"
                  placeholder="Confirm password"
                  required
                />
              </div>

              <p class="register-req-title">Password requirements:</p>
              <ul class="register-reqs">
                <li data-rule="length">8 Characters</li>
                <li data-rule="upper">1 uppercase letter (A to Z)</li>
                <li data-rule="lower">1 lowercase letter (a to z)</li>
                <li data-rule="digit">1 digit (0 to 9)</li>
                <li data-rule="match">Passwords match</li>
              </ul>

              <div class="alert alert-danger d-none" id="register-error" role="alert"></div>
              <div class="alert alert-success d-none" id="register-success" role="status"></div>

              <div class="register-actions">
                <button type="submit" class="register-continue" id="register-submit">Continue</button>
                <a class="register-login" href="index.html">Log in</a>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
    <script type="module" src="app/registerMain.js"></script>
  </body>
</html>
