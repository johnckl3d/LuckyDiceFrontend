<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register — Lucky Dice</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="login-screen">
      <div class="login-card card shadow">
        <div class="card-body p-4">
          <h1 class="h4 mb-1">Create an account</h1>
          <p class="text-muted mb-4">Register to play Lucky Dice</p>
          <form id="register-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="register-userid">User ID</label>
              <input
                class="form-control"
                id="register-userid"
                name="userId"
                autocomplete="username"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="register-password">Password</label>
              <input
                type="password"
                class="form-control"
                id="register-password"
                name="password"
                autocomplete="new-password"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="register-email">Email address</label>
              <input
                type="email"
                class="form-control"
                id="register-email"
                name="emailAddress"
                autocomplete="email"
                required
              />
            </div>
            <div class="alert alert-danger d-none" id="register-error" role="alert"></div>
            <div class="alert alert-success d-none" id="register-success" role="status"></div>
            <button type="submit" class="btn btn-dark w-100" id="register-submit">
              Register
            </button>
          </form>
          <a class="btn btn-link w-100 mt-2" href="index.html">Back to sign in</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
    <script type="module" src="app/registerMain.js"></script>
  </body>
</html>
